apiVersion: v1
kind: Service
metadata:
  name: edutoon-mariadb
  namespace: edutoon-benchmark
  labels:
    app: edutoon-mariadb
spec:
  selector:
    app: edutoon-mariadb
  ports:
    - name: mariadb
      port: 3306
      targetPort: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edutoon-mariadb
  namespace: edutoon-benchmark
spec:
  serviceName: edutoon-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: edutoon-mariadb
  template:
    metadata:
      labels:
        app: edutoon-mariadb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mariadb
              containerPort: 3306
          env:
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: edutoon-config
                  key: DB_USER
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: edutoon-config
                  key: DB_NAME
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edutoon-runtime
                  key: DB_PASS
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edutoon-runtime
                  key: DB_ROOT_PASS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - mariadb-admin ping --host=127.0.0.1 --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" --silent
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - mariadb-admin ping --host=127.0.0.1 --user="$MARIADB_USER" --password="$MARIADB_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
