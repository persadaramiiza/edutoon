apiVersion: v1
kind: Service
metadata:
  name: edutoon-frontend
  namespace: edutoon-benchmark
spec:
  type: LoadBalancer
  selector:
    app: edutoon-frontend
  ports:
    - name: http
      port: 3333
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edutoon-frontend
  namespace: edutoon-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edutoon-frontend
  template:
    metadata:
      labels:
        app: edutoon-frontend
    spec:
      containers:
        - name: frontend
          image: edutoon-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3333
          env:
            - name: BACKEND_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: edutoon-config
                  key: BACKEND_INTERNAL_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
