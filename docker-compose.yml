services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_USER: ${DB_USER:-edutoon}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS must be supplied from the local environment}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS must be supplied from the local environment}
      MARIADB_DATABASE: ${DB_NAME:-edutoon_benchmark}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb_data:
