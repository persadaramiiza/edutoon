apiVersion: batch/v1
kind: Job
metadata:
  name: edutoon-backend-migration
  labels:
    app.kubernetes.io/name: edutoon-backend
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edutoon-backend
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          # Gunakan image ECR dan digest yang sama dengan Deployment.
          image: edutoon-backend:0.0.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/database/run-migrations.js
          envFrom:
            - configMapRef:
                name: edutoon-backend-config
            - secretRef:
                name: edutoon-backend-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
